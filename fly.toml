# draftkit on Fly.io: ONE machine, ONE uvicorn worker, one volume. The SSE
# EventBus and the pool cache live in-process and SQLite is a single file, so
# this app must never scale past a single machine — `fly scale count 1`.
#
# Set the secrets before the first deploy (see .env.example for what each is):
#   fly secrets set DRAFTKIT_AUTH=google DRAFTKIT_GOOGLE_CLIENT_ID=... \
#     DRAFTKIT_GOOGLE_CLIENT_SECRET=... DRAFTKIT_SECRET_KEY=... \
#     DRAFTKIT_ALLOWED_EMAILS=... DRAFTKIT_OWNER_EMAIL=... \
#     DRAFTKIT_PUBLIC_URL=https://<app>.fly.dev

app = "draftkit"
primary_region = "ewr"

[build]
  dockerfile = "docker/Dockerfile"

[mounts]
  source = "draftkit_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Never auto-stop during draft season: a stopped machine drops every SSE
  # stream and cold-starts in the middle of somebody's pick clock.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
